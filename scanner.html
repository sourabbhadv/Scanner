<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Doc Scanner – English + Hindi OCR</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#000;color:#fff;font:14px system-ui,sans-serif}
#cam{position:fixed;inset:0}
video,#ov{position:absolute;inset:0;width:100%;height:100%}video{object-fit:contain}#ov{pointer-events:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .15s}#flash.on{opacity:.8}
.row{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px}
#top{top:env(safe-area-inset-top,0px);background:linear-gradient(#000b,transparent)}
#bot{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);background:linear-gradient(transparent,#000c);flex-direction:column;gap:12px}
#st{position:absolute;top:calc(env(safe-area-inset-top,0px) + 60px);left:50%;transform:translateX(-50%);background:#000a;padding:6px 14px;border-radius:20px;white-space:nowrap}
#bar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 96px);left:30%;right:30%;height:4px;background:#fff3;border-radius:2px}#barI{display:block;height:100%;width:0;background:#2ecc71;border-radius:2px}
.b,select{background:#ffffff22;color:#fff;border:0;border-radius:18px;padding:8px 14px;font:inherit}select option{color:#000}
.chips{display:flex;gap:8px}.chips .b.on{background:#2ecc71;color:#000}
#ctl{width:100%;display:flex;align-items:center;justify-content:space-between}
#shut{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:#2ecc71;box-shadow:0 0 0 3px #0008}
#thumb{width:52px;height:52px;border-radius:8px;object-fit:cover;background:#222}
#lib{position:fixed;inset:0;background:#0b0d10;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 40px}
#lib header{display:flex;gap:8px;align-items:center;justify-content:space-between;position:sticky;top:0;background:#0b0d10;padding:6px 0 10px}
.card{display:flex;gap:10px;background:#171a1f;border-radius:12px;padding:10px;margin-bottom:10px;align-items:center}
.card img{width:64px;height:88px;object-fit:cover;border-radius:6px;background:#fff}
.card>div{flex:1;min-width:0}.card b{display:block;overflow-wrap:anywhere}.card small{color:#9aa4b2}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.acts .b{padding:5px 11px;font-size:13px}
.empty{color:#9aa4b2;text-align:center;margin-top:60px}
</style></head><body>
<div id="cam">
 <video id="v" playsinline muted autoplay></video><canvas id="ov"></canvas><div id="flash"></div>
 <div class="row" id="top">
  <label class="b"><input type="checkbox" id="auto" checked> Auto</label>
  <select id="lang"><option value="eng+hin">English + Hindi</option><option value="eng">English only</option><option value="hin">Hindi only</option></select>
  <button class="b" id="libBtn">Files <b id="cnt">0</b></button>
 </div>
 <div id="st">Starting…</div><div id="bar"><i id="barI"></i></div>
 <div class="row" id="bot">
  <div class="chips" id="filters"><button class="b on" data-f="enh">Enhanced</button><button class="b" data-f="bw">B&amp;W</button><button class="b" data-f="color">Colour</button><button class="b" data-f="orig">Original</button></div>
  <div id="ctl">
   <label class="b">Import<input type="file" id="imp" accept="image/*" multiple hidden></label>
   <button id="shut" aria-label="Capture"></button>
   <img id="thumb" alt="">
  </div>
 </div>
</div>
<div id="lib" hidden>
 <header><button class="b" id="back">← Camera</button><button class="b" id="merge">Merge selected → PDF</button></header>
 <div id="list"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
const $=id=>document.getElementById(id),v=$('v');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const say=t=>$('st').textContent=t;
let docs=[],filter='enh',cvOK=false,stream=null;

/* ---------- storage ---------- */
const db=new Promise((res,rej)=>{const r=indexedDB.open('scanner',1);r.onupgradeneeded=()=>r.result.createObjectStore('d',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(m,f)=>{const d=await db;return new Promise((res,rej)=>{const t=d.transaction('d',m),q=f(t.objectStore('d'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
const put=o=>tx('readwrite',s=>s.put(o)),all=()=>tx('readonly',s=>s.getAll()),del=id=>tx('readwrite',s=>s.delete(id));

/* ---------- OpenCV loader ---------- */
function loadScript(u){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.async=true;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function loadCV(){
 for(const u of['https://docs.opencv.org/4.8.0/opencv.js','https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.9.0-release.2/dist/opencv.js']){
  try{await loadScript(u);await new Promise(r=>{if(cv.Mat)return r();if(typeof cv.then==='function')cv.then(m=>{delete m.then;window.cv=m;r()});else cv.onRuntimeInitialized=r});cvOK=true;return}catch(e){}
 }
 say('Scanner engine failed to load – check internet')
}

/* ---------- geometry ---------- */
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const disp=(a,b)=>a.reduce((s,p,i)=>s+dist(p,b[i]),0)/4;
function order(p){const s=p.map(a=>a[0]+a[1]),d=p.map(a=>a[0]-a[1]);return[p[s.indexOf(Math.min(...s))],p[d.indexOf(Math.max(...d))],p[s.indexOf(Math.max(...s))],p[d.indexOf(Math.min(...d))]]}
function findQuad(src){
 const W=src.cols,H=src.rows,g=new cv.Mat(),b=new cv.Mat(),e=new cv.Mat(),m=new cv.Mat(),k=cv.Mat.ones(5,5,cv.CV_8U);
 cv.cvtColor(src,g,cv.COLOR_RGBA2GRAY);cv.GaussianBlur(g,b,new cv.Size(5,5),0);
 cv.Canny(b,e,40,120);cv.dilate(e,e,k);cv.rectangle(e,new cv.Point(0,0),new cv.Point(W-1,H-1),new cv.Scalar(0),4);
 cv.threshold(b,m,0,255,cv.THRESH_BINARY+cv.THRESH_OTSU);cv.morphologyEx(m,m,cv.MORPH_OPEN,k);
 let best=null,ba=0;
 for(const bin of[e,m]){
  const cs=new cv.MatVector(),h=new cv.Mat();cv.findContours(bin,cs,h,cv.RETR_EXTERNAL,cv.CHAIN_APPROX_SIMPLE);
  for(let i=0;i<cs.size();i++){const c=cs.get(i),a=cv.contourArea(c);
   if(a>.15*W*H&&a<.97*W*H&&a>ba){const hu=new cv.Mat();cv.convexHull(c,hu,false,true);const pe=cv.arcLength(hu,true);
    for(const f of[.02,.04,.06]){const ap=new cv.Mat();cv.approxPolyDP(hu,ap,f*pe,true);
     if(ap.rows===4){const d=ap.data32S;best=[[d[0],d[1]],[d[2],d[3]],[d[4],d[5]],[d[6],d[7]]];ba=a;ap.delete();break}ap.delete()}
    hu.delete()}
   c.delete()}
  cs.delete();h.delete()}
 [g,b,e,m,k].forEach(x=>x.delete());
 return best&&order(best).map(p=>[p[0]/W,p[1]/H]);
}
function paperOf(q,vw,vh){
 const P=q.map(p=>[p[0]*vw,p[1]*vh]),w=(dist(P[0],P[1])+dist(P[3],P[2]))/2,h=(dist(P[0],P[3])+dist(P[1],P[2]))/2;
 const lo=Math.min(w,h),r=Math.max(w,h)/lo,land=w>h;
 const std=[['A4',1.414,595.28,841.89],['Letter',1.294,612,792],['Legal',1.647,612,1008]];
 const n=std.map(s=>[s,Math.abs(r/s[1]-1)]).sort((a,b)=>a[1]-b[1])[0];
 let name='Custom',rr=r,pw=595.28,ph=595.28*r;
 if(n[1]<.07){[name,rr,pw,ph]=n[0]}
 if(land)[pw,ph]=[ph,pw];
 return{P,name,rr,pw,ph,land,lo}
}

/* ---------- image filters ---------- */
function bgEst(x){const s=new cv.Mat(),b=new cv.Mat(),k=cv.Mat.ones(5,5,cv.CV_8U);
 cv.resize(x,s,new cv.Size(x.cols>>3,x.rows>>3),0,0,cv.INTER_AREA);cv.dilate(s,s,k);cv.GaussianBlur(s,s,new cv.Size(11,11),0);
 cv.resize(s,b,new cv.Size(x.cols,x.rows),0,0,cv.INTER_LINEAR);s.delete();k.delete();return b}
function applyFilter(m,f){
 if(f==='orig')return;
 const rgb=new cv.Mat();cv.cvtColor(m,rgb,cv.COLOR_RGBA2RGB);
 if(f==='color'){const bg=bgEst(rgb);cv.divide(rgb,bg,rgb,255,-1);cv.cvtColor(rgb,m,cv.COLOR_RGB2RGBA);bg.delete()}
 else{const g=new cv.Mat();cv.cvtColor(rgb,g,cv.COLOR_RGB2GRAY);const bg=bgEst(g);cv.divide(g,bg,g,255,-1);
  if(f==='bw'){const t=new cv.Mat();cv.adaptiveThreshold(g,t,255,cv.ADAPTIVE_THRESH_GAUSSIAN_C,cv.THRESH_BINARY,41,15);t.copyTo(g);t.delete()}
  cv.cvtColor(g,m,cv.COLOR_GRAY2RGBA);g.delete();bg.delete()}
 rgb.delete()
}

/* ---------- scan pipeline ---------- */
async function addScan(c,hint){
 if(!cvOK){say('Engine still loading…');return}
 const sm=document.createElement('canvas'),sc=640/c.width;sm.width=640;sm.height=Math.round(c.height*sc);
 sm.getContext('2d').drawImage(c,0,0,sm.width,sm.height);
 const s2=cv.imread(sm);let q=findQuad(s2);s2.delete();
 const found=!!(q||hint);q=q||hint||[[0,0],[1,0],[1,1],[0,1]];
 const p=paperOf(q,c.width,c.height),S=Math.max(900,Math.min(2000,Math.round(p.lo))),OW=Math.round(p.land?S*p.rr:S),OH=Math.round(p.land?S:S*p.rr);
 const src=cv.imread(c),dst=new cv.Mat();
 const a=cv.matFromArray(4,1,cv.CV_32FC2,p.P.flat()),bq=cv.matFromArray(4,1,cv.CV_32FC2,[0,0,OW,0,OW,OH,0,OH]);
 const M=cv.getPerspectiveTransform(a,bq);cv.warpPerspective(src,dst,M,new cv.Size(OW,OH),cv.INTER_LINEAR,cv.BORDER_REPLICATE);
 applyFilter(dst,filter);
 const oc=document.createElement('canvas');cv.imshow(oc,dst);
 [src,dst,a,bq,M].forEach(x=>x.delete());
 const img=await new Promise(r=>oc.toBlob(r,'image/jpeg',.88));
 const n=docs.length?Math.max(...docs.map(d=>d.n))+1:1,t=new Date();
 const d={id:Date.now()+Math.random(),n,name:'Scan '+String(n).padStart(3,'0'),created:+t,paper:p.name+(found?'':' (no edge found)'),pw:p.pw,ph:p.ph,img,status:'queued',text:'',pdf:null};
 docs.unshift(d);await put(d);queue.push(d.id);render();pump();
 say('Saved ✓ '+d.name+' ('+p.name+') – place next page')
}

/* ---------- OCR queue ---------- */
let worker=null,wLang='',queue=[],running=false,cur=null;
async function getW(){const l=$('lang').value;if(worker&&wLang===l)return worker;if(worker)await worker.terminate();
 worker=await Tesseract.createWorker(l.split('+'),1,{logger:m=>{if(cur&&m.status==='recognizing text'){cur.p=Math.round(m.progress*100);badge(cur)}}});
 await worker.setParameters({user_defined_dpi:'300'});wLang=l;return worker}
async function fixPdf(bytes,d){if(!window.PDFLib)return new Blob([bytes],{type:'application/pdf'});
 const doc=await PDFLib.PDFDocument.load(bytes),pg=doc.getPage(0),s=pg.getSize();pg.scale(d.pw/s.width,d.ph/s.height);
 return new Blob([await doc.save()],{type:'application/pdf'})}
async function pump(){if(running)return;running=true;
 while(queue.length){const d=docs.find(x=>x.id===queue.shift());if(!d)continue;cur=d;d.status='running';d.p=0;render();
  try{const w=await getW(),{data}=await w.recognize(d.img,{},{pdf:true});d.text=data.text;d.pdf=await fixPdf(new Uint8Array(data.pdf),d);d.status='done'}
  catch(e){console.error(e);d.status='error'}
  if(docs.includes(d))await put(d);render()}
 running=false;cur=null}

/* ---------- library ---------- */
const badgeTxt=d=>d.status==='done'?'OCR ✓ '+(d.text.trim().split(/\s+/).filter(Boolean).length)+' words':d.status==='running'?'OCR '+(d.p||0)+'%':d.status==='error'?'OCR failed':'OCR queued';
function badge(d){const e=document.querySelector(`[data-id="${d.id}"] .bd`);if(e)e.textContent=badgeTxt(d)}
function render(){
 $('cnt').textContent=docs.length;
 if(docs[0]){docs[0]._u=docs[0]._u||URL.createObjectURL(docs[0].img);$('thumb').src=docs[0]._u}
 if($('lib').hidden)return;
 $('list').innerHTML=docs.length?docs.map(d=>{d._u=d._u||URL.createObjectURL(d.img);
  return`<div class="card" data-id="${d.id}"><input type="checkbox" class="sel"><img src="${d._u}"><div><b class="nm">${esc(d.name)}</b><small>${d.paper} · ${new Date(d.created).toLocaleString()} · <span class="bd">${badgeTxt(d)}</span></small>
  <div class="acts"><button class="b" data-a="pdf">PDF</button><button class="b" data-a="jpg">JPG</button><button class="b" data-a="txt">TXT</button><button class="b" data-a="copy">Copy</button>${d.status==='error'?'<button class="b" data-a="retry">Retry OCR</button>':''}<button class="b" data-a="del">Delete</button></div></div></div>`}).join(''):'<p class="empty">No scans yet. Point the camera at a document.</p>'}
const dl=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5e3)};
async function pdfOf(d){if(d.pdf)return d.pdf.arrayBuffer();
 const doc=await PDFLib.PDFDocument.create(),im=await doc.embedJpg(await d.img.arrayBuffer()),p=doc.addPage([d.pw,d.ph]);p.drawImage(im,{x:0,y:0,width:d.pw,height:d.ph});return doc.save()}
$('list').onclick=async e=>{
 const a=e.target.dataset.a,card=e.target.closest('.card');if(!card)return;const d=docs.find(x=>x.id==card.dataset.id);
 if(e.target.classList.contains('nm')){const n=prompt('Rename',d.name);if(n){d.name=n;await put(d);render()}return}
 if(!a)return;
 if(a==='pdf')dl(new Blob([await pdfOf(d)],{type:'application/pdf'}),d.name+'.pdf');
 if(a==='jpg')dl(d.img,d.name+'.jpg');
 if(a==='txt')dl(new Blob(['\ufeff'+d.text],{type:'text/plain;charset=utf-8'}),d.name+'.txt');
 if(a==='copy'){try{await navigator.clipboard.writeText(d.text)}catch(_){}}
 if(a==='retry'){d.status='queued';queue.push(d.id);render();pump()}
 if(a==='del'&&confirm('Delete '+d.name+'?')){docs=docs.filter(x=>x!==d);await del(d.id);render()}
};
$('merge').onclick=async()=>{
 const ids=[...document.querySelectorAll('.card')].filter(c=>c.querySelector('.sel').checked).map(c=>c.dataset.id).reverse();
 if(!ids.length)return alert('Tick the files to merge first.');
 const out=await PDFLib.PDFDocument.create();
 for(const id of ids){const src=await PDFLib.PDFDocument.load(await pdfOf(docs.find(x=>x.id==id)));const[pg]=await out.copyPages(src,[0]);out.addPage(pg)}
 dl(new Blob([await out.save()],{type:'application/pdf'}),'Merged_'+Date.now()+'.pdf')
};
$('libBtn').onclick=()=>{$('lib').hidden=false;render()};$('back').onclick=()=>$('lib').hidden=true;
$('filters').onclick=e=>{const f=e.target.dataset.f;if(!f)return;filter=f;[...$('filters').children].forEach(b=>b.classList.toggle('on',b===e.target))};

/* ---------- camera + live detection ---------- */
let prev=null,lastQ=null,stable=0,lock=false,lockQ=null,miss=0;
const dc=document.createElement('canvas');
function draw(q,p){
 const o=$('ov'),r=o.getBoundingClientRect(),k=devicePixelRatio||1;o.width=r.width*k;o.height=r.height*k;const x=o.getContext('2d');x.scale(k,k);
 $('barI').style.width=p*100+'%';if(!q)return;
 const vw=v.videoWidth,vh=v.videoHeight,s=Math.min(r.width/vw,r.height/vh),ox=(r.width-vw*s)/2,oy=(r.height-vh*s)/2;
 x.beginPath();q.forEach((a,i)=>x[i?'lineTo':'moveTo'](ox+a[0]*vw*s,oy+a[1]*vh*s));x.closePath();
 x.fillStyle=`rgba(46,204,113,${.12+.2*p})`;x.fill();x.lineWidth=3;x.strokeStyle=p>0?'#2ecc71':'#fff';x.stroke()}
function shoot(){
 lock=true;lockQ=prev;$('flash').classList.add('on');setTimeout(()=>$('flash').classList.remove('on'),130);navigator.vibrate&&navigator.vibrate(30);
 const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);addScan(c,lastQ)}
function tick(){
 if(!stream||!cvOK||!v.videoWidth||!$('lib').hidden)return setTimeout(tick,250);
 try{
  dc.width=480;dc.height=Math.round(480*v.videoHeight/v.videoWidth);dc.getContext('2d').drawImage(v,0,0,dc.width,dc.height);
  const s=cv.imread(dc);let q=findQuad(s);s.delete();
  if(q&&prev&&disp(q,prev)<.1)q=q.map((p,i)=>[(p[0]+prev[i][0])/2,(p[1]+prev[i][1])/2]);
  const mv=q&&prev?disp(q,prev):1;
  if(q){miss=0;if(mv<.012){stable=stable||Date.now()}else stable=0}else{miss++;stable=0}
  prev=q;if(q)lastQ=q;
  if(lock&&(miss>5||(lockQ&&q&&disp(q,lockQ)>.12)))lock=false;
  const pr=stable&&!lock?Math.min(1,(Date.now()-stable)/1200):0;
  draw(q,pr);
  if(!lock)say(!q?'Looking for paper…':pr>0?'Hold steady… '+paperOf(q,v.videoWidth,v.videoHeight).name:'Paper found');
  if(pr>=1&&$('auto').checked&&!lock)shoot();
 }catch(e){console.error(e)}
 setTimeout(tick,120)
}
$('shut').onclick=()=>{if(v.videoWidth)shoot()};
$('imp').onchange=async e=>{
 for(const f of e.target.files){const bm=await createImageBitmap(f,{imageOrientation:'from-image'}),k=Math.min(1,3200/Math.max(bm.width,bm.height)),c=document.createElement('canvas');
  c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);await addScan(c,null)}
 e.target.value=''};
async function startCam(){
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:3840},height:{ideal:2160}},audio:false});
  v.srcObject=stream;try{await stream.getVideoTracks()[0].applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(_){}
 }catch(e){say('Camera blocked – use Import to take photos instead')}}

(async()=>{
 docs=(await all()).sort((a,b)=>b.created-a.created);
 docs.forEach(d=>{if(d.status!=='done'){d.status='queued';queue.push(d.id)}});
 render();startCam();say('Loading scanner engine…');
 await loadCV();if(cvOK){say('Ready – point at a document');tick()}
 pump()
})();
</script></body></html>
